  <link rel="stylesheet" href="css/style.css?v=1.0.1">
  <style>
    /* Layar pembuka instan (sebelum CSS & skrip utama siap) */
    .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#062828;color:#C2DFDD;font:600 14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;z-index:1}
    .boot img{width:72px;height:72px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
    .boot b{font:700 26px/1.1 'Playfair Display',Georgia,serif;color:#fff}
    .boot i{width:120px;height:4px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
    .boot i::after{content:'';position:absolute;left:-40%;width:40%;height:100%;border-radius:9px;background:#E8A33D;animation:bootbar 1.1s ease-in-out infinite}
    @keyframes bootbar{to{left:100%}}
  </style>
  <!-- config dimuat sinkron agar server bisa "dibangunkan" sedini mungkin -->
  <script src="js/config.js?v=1.0.1"></script>
  <script>
    (function () {
      try {
        var u = window.GAS_URL; if (!u || /XXXX/.test(u)) return;
        var s = null; try { s = JSON.parse(localStorage.getItem('vs:v1:sesi') || 'null'); } catch (e) { }
        window._preWarm = Date.now();
        fetch(u + '?w=' + (s && s.token ? 'app' : 'pub') + '&t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' }).catch(function () { });
      } catch (e) { }
    })();
  </script>
  <script defer src="js/icons.js?v=1.0.1"></script>

  <script defer src="js/app.js?v=1.0.1"></script>
  <script defer src="js/pages-pesanan.js?v=1.0.1"></script>
  <script defer src="js/pages-produk.js?v=1.0.1"></script>
  <script defer src="js/pages-pelanggan.js?v=1.0.1"></script>
